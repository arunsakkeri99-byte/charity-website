<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Donate | Fur-ever Homes</title>
    <meta name="description" content="Donate to Fur-ever Homes and help dogs in need." />
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <a href="#main-content" class="skip-link">Skip to main content</a>
    <header>
        <nav class="navbar" aria-label="Main navigation">
            <div class="logo">
                <img src="images/doglogo.jpeg" alt="Fur-ever Homes logo" class="nav-logo">
                <a href="index.html">Fur-ever Homes</a>
            </div>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="aboutus.html">About Us</a></li>
                <li><a href="managesales.html">Manage Donations</a></li>
                <li><a href="analytics.html">Data Analytics</a></li>
                <li><a href="donate.html" class="donate-btn">Donate</a></li>
            </ul>
        </nav>
    </header>
    <main id="main-content">
        <h1>Donate to Our Cause</h1>
        <form id="donateForm">
            <label for="donorName">Your Name:</label>
            <input type="text" id="donorName" name="donorName" required>
 
            <label for="donationAmount">Donation Amount:</label>
            <input type="number" id="donationAmount" name="donationAmount" required>
 
            <label for="donationMessage">Message (optional):</label>
            <textarea id="donationMessage" name="donationMessage"></textarea>
 
            <button type="submit" class="donate-btn">Donate</button>
        </form>
    </main>
    <footer>
        <p>&copy; 2026 Fur-ever Homes. All rights reserved.</p>
    </footer>
 
    <script src="Js/main.js"></script>
</body>
</html>
